<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化回测仪表盘</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a192f;
            --bg-alt: #112240;
            --text-primary: #e6f1ff;
            --text-muted: #8892b0;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --accent: #3182ce;
            --accent-hover: #2b6cb0;
            --positive: #38a169;
            --negative: #e53e3e;
            --sidebar-width: 300px;
            --header-height: 72px;
            --radius: 10px;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, var(--bg-deep) 0%, #1a365d 100%);
            color: var(--text-primary);
            font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── Header ── */
        .header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(10, 25, 47, 0.6);
            backdrop-filter: blur(6px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #ffffff;
        }

        /* ── Layout ── */
        .layout {
            display: flex;
            gap: 24px;
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px;
            min-height: calc(100vh - var(--header-height));
        }

        /* ── Sidebar ── */
        .sidebar {
            flex: 0 0 var(--sidebar-width);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            color: #2d3748;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #2d3748;
            background: #f7fafc;
            transition: border-color 0.15s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(49, 130, 206, 0.2);
        }

        .btn-run {
            width: 100%;
            margin-top: 8px;
            padding: 10px 16px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-run:hover {
            background: var(--accent-hover);
        }

        .btn-run:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .status-bar {
            margin-top: 14px;
            padding: 8px 10px;
            border-radius: 6px;
            background: #edf2f7;
            font-size: 0.8rem;
            color: #4a5568;
            text-align: center;
        }

        .status-bar.running {
            background: #ebf8ff;
            color: #2b6cb0;
        }

        /* ── Main content ── */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── Metric cards row ── */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .metrics-row.dual-mode {
            grid-template-columns: repeat(4, 1fr);
        }

        .metric-card {
            text-align: center;
            padding: 18px 16px;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #718096;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a202c;
        }

        .metric-value.positive { color: var(--positive); }
        .metric-value.negative { color: var(--negative); }

        .gap-card {
            display: none;
        }

        .gap-card.visible {
            display: block;
        }

        /* ── Charts ── */
        .chart-card {
            padding: 16px 12px 8px;
        }

        .chart-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1a202c;
            padding: 0 8px 8px;
        }

        .chart-container {
            width: 100%;
            height: 320px;
        }

        .chart-container.drawdown {
            height: 240px;
        }

        /* ── Trades table ── */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        thead th {
            background: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid var(--card-border);
            white-space: nowrap;
        }

        tbody td {
            padding: 9px 12px;
            border-bottom: 1px solid #edf2f7;
            color: #2d3748;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        .side-buy { color: var(--positive); font-weight: 600; }
        .side-sell { color: var(--negative); font-weight: 600; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: #c6f6d5;
            color: #276749;
        }

        /* ── Responsive ── */
        @media (max-width: 1023px) {
            .layout {
                flex-direction: column;
                padding: 16px;
            }

            .sidebar {
                flex: none;
                width: 100%;
            }

            .metrics-row,
            .metrics-row.dual-mode {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>量化回测仪表盘</h1>
    </header>

    <div class="layout">
        <!-- 左侧控制面板 -->
        <aside class="sidebar">
            <div class="card">
                <div class="card-title">回测参数</div>
                <form id="backtest-form">
                    <div class="form-group">
                        <label for="symbol">股票代码</label>
                        <input type="text" id="symbol" name="symbol" value="TEST" placeholder="例如 TEST">
                    </div>
                    <div class="form-group">
                        <label for="start-date">开始日期</label>
                        <input type="date" id="start-date" name="start_date" value="2023-01-01">
                    </div>
                    <div class="form-group">
                        <label for="end-date">结束日期</label>
                        <input type="date" id="end-date" name="end_date" value="2023-01-15">
                    </div>
                    <div class="form-group">
                        <label for="csv-path">数据文件路径</label>
                        <input type="text" id="csv-path" name="csv_path" value="tests/sample_data.csv">
                    </div>
                    <div class="form-group">
                        <label for="mode">运行模式</label>
                        <select id="mode" name="mode">
                            <option value="ideal">ideal（理想撮合）</option>
                            <option value="realistic" selected>realistic（真实撮合）</option>
                            <option value="dual">dual（双模对比）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="latency">延迟 (ms)</label>
                        <input type="number" id="latency" name="latency_ms" value="0" min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label for="slippage">滑点 (bps)</label>
                        <input type="number" id="slippage" name="slippage_bps" value="0" min="0" step="1">
                    </div>
                    <button type="submit" class="btn-run" id="btn-run">运行回测</button>
                </form>
                <div class="status-bar" id="status-bar">就绪</div>
            </div>
        </aside>

        <!-- 右侧主显示区 -->
        <main class="main">
            <!-- 指标卡片 -->
            <div class="metrics-row" id="metrics-row">
                <div class="card metric-card">
                    <div class="metric-label">总回报</div>
                    <div class="metric-value positive" id="metric-total-return">—</div>
                </div>
                <div class="card metric-card">
                    <div class="metric-label">最大回撤</div>
                    <div class="metric-value negative" id="metric-max-drawdown">—</div>
                </div>
                <div class="card metric-card gap-card" id="gap-card">
                    <div class="metric-label">回报差距 (ideal − realistic)</div>
                    <div class="metric-value" id="metric-gap">—</div>
                </div>
            </div>

            <!-- 权益曲线 -->
            <div class="card chart-card">
                <div class="chart-title">权益曲线</div>
                <div class="chart-container" id="equity-chart"></div>
            </div>

            <!-- 回撤曲线 -->
            <div class="card chart-card">
                <div class="chart-title">回撤曲线</div>
                <div class="chart-container drawdown" id="drawdown-chart"></div>
            </div>

            <!-- 交易记录 -->
            <div class="card">
                <div class="card-title">交易记录</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>方向</th>
                                <th>数量</th>
                                <th>成交价</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="trades-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
    /**
     * 量化回测仪表盘 — 前端框架
     * 当前使用静态占位数据；后续通过 API 接入真实回测结果。
     */
    const DashboardApp = {
        state: {
            jobId: null,
            pollTimer: null,
            isDual: false,
        },

        els: {},

        plotlyConfig: {
            responsive: true,
            displayModeBar: false,
        },

        plotlyLayout: {
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(0,0,0,0)",
            margin: { t: 10, r: 20, b: 40, l: 60 },
            font: { family: "Segoe UI, system-ui, sans-serif", color: "#4a5568", size: 12 },
            xaxis: { gridcolor: "#edf2f7", linecolor: "#e2e8f0" },
            yaxis: { gridcolor: "#edf2f7", linecolor: "#e2e8f0" },
            legend: { orientation: "h", y: 1.12, x: 0 },
        },

        /* ── 占位数据 ── */
        placeholder: {
            dates: [
                "2023-01-01","2023-01-02","2023-01-03","2023-01-04","2023-01-05",
                "2023-01-06","2023-01-07","2023-01-08","2023-01-09","2023-01-10",
                "2023-01-11","2023-01-12","2023-01-13","2023-01-14","2023-01-15",
            ],
            equity: [
                100000, 100150, 100320, 100180, 100450,
                100620, 100580, 100750, 100900, 100820,
                101050, 101200, 101150, 101380, 101520,
            ],
            idealEquity: [
                100000, 100180, 100380, 100250, 100550,
                100750, 100720, 100920, 101100, 101030,
                101300, 101480, 101440, 101700, 101880,
            ],
            trades: [
                { date: "2023-01-05", side: "BUY",  quantity: 100, price: 102.35, status: "已成交" },
                { date: "2023-01-10", side: "BUY",  quantity: 100, price: 103.10, status: "已成交" },
                { date: "2023-01-15", side: "BUY",  quantity: 100, price: 104.20, status: "已成交" },
            ],
            metrics: {
                totalReturn: 0.0152,
                maxDrawdown: 0.0089,
                gap: 0.0036,
            },
        },

        /* ── 初始化 ── */
        init() {
            this.cacheElements();
            this.bindEvents();
            this.updateModeVisibility();
            this.renderPlaceholder();
        },

        cacheElements() {
            this.els = {
                form:          document.getElementById("backtest-form"),
                mode:          document.getElementById("mode"),
                btnRun:        document.getElementById("btn-run"),
                statusBar:     document.getElementById("status-bar"),
                metricsRow:    document.getElementById("metrics-row"),
                gapCard:       document.getElementById("gap-card"),
                totalReturn:   document.getElementById("metric-total-return"),
                maxDrawdown:   document.getElementById("metric-max-drawdown"),
                gap:           document.getElementById("metric-gap"),
                equityChart:   document.getElementById("equity-chart"),
                drawdownChart: document.getElementById("drawdown-chart"),
                tradesBody:    document.getElementById("trades-body"),
            };
        },

        bindEvents() {
            this.els.form.addEventListener("submit", (e) => {
                e.preventDefault();
                this.onRunClick();
            });
            this.els.mode.addEventListener("change", () => {
                this.updateModeVisibility();
            });
        },

        updateModeVisibility() {
            const isDual = this.els.mode.value === "dual";
            this.state.isDual = isDual;
            this.els.gapCard.classList.toggle("visible", isDual);
            this.els.metricsRow.classList.toggle("dual-mode", isDual);
        },

        /* ── 工具函数 ── */
        formatPercent(value, digits = 2) {
            const sign = value >= 0 ? "+" : "";
            return sign + (value * 100).toFixed(digits) + "%";
        },

        computeDrawdown(equity) {
            let peak = equity[0];
            return equity.map((v) => {
                peak = Math.max(peak, v);
                return peak > 0 ? -(peak - v) / peak : 0;
            });
        },

        getFormData() {
            const fd = new FormData(this.els.form);
            return {
                symbol:      fd.get("symbol"),
                start_date:  fd.get("start_date"),
                end_date:    fd.get("end_date"),
                csv_path:    fd.get("csv_path"),
                mode:        fd.get("mode"),
                latency_ms:  parseFloat(fd.get("latency_ms")) || 0,
                slippage_bps: parseFloat(fd.get("slippage_bps")) || 0,
            };
        },

        setStatus(text, running = false) {
            this.els.statusBar.textContent = text;
            this.els.statusBar.classList.toggle("running", running);
        },

        /* ── 渲染函数 ── */
        renderMetrics(metrics) {
            const tr = metrics.totalReturn;
            this.els.totalReturn.textContent = this.formatPercent(tr);
            this.els.totalReturn.className = "metric-value " + (tr >= 0 ? "positive" : "negative");

            const dd = metrics.maxDrawdown;
            this.els.maxDrawdown.textContent = "-" + (dd * 100).toFixed(2) + "%";

            if (this.state.isDual && metrics.gap != null) {
                this.els.gap.textContent = this.formatPercent(metrics.gap);
                this.els.gap.className = "metric-value " + (metrics.gap >= 0 ? "positive" : "negative");
            }
        },

        renderEquityChart(dates, equity, idealEquity) {
            const traces = [{
                x: dates,
                y: equity,
                type: "scatter",
                mode: "lines",
                name: this.state.isDual ? "realistic" : "权益",
                line: { color: "#3182ce", width: 2 },
            }];

            if (this.state.isDual && idealEquity) {
                traces.push({
                    x: dates,
                    y: idealEquity,
                    type: "scatter",
                    mode: "lines",
                    name: "ideal",
                    line: { color: "#38a169", width: 2, dash: "dot" },
                });
            }

            const layout = Object.assign({}, this.plotlyLayout, {
                yaxis: Object.assign({}, this.plotlyLayout.yaxis, {
                    tickformat: ",.0f",
                    title: "净值",
                }),
            });

            Plotly.newPlot(this.els.equityChart, traces, layout, this.plotlyConfig);
        },

        renderDrawdownChart(dates, equity) {
            const dd = this.computeDrawdown(equity);
            const trace = {
                x: dates,
                y: dd,
                type: "scatter",
                mode: "lines",
                fill: "tozeroy",
                name: "回撤",
                line: { color: "#e53e3e", width: 1.5 },
                fillcolor: "rgba(229, 62, 62, 0.12)",
            };

            const layout = Object.assign({}, this.plotlyLayout, {
                yaxis: Object.assign({}, this.plotlyLayout.yaxis, {
                    tickformat: ".1%",
                    title: "回撤",
                }),
            });

            Plotly.newPlot(this.els.drawdownChart, [trace], layout, this.plotlyConfig);
        },

        renderTradesTable(trades) {
            this.els.tradesBody.innerHTML = trades.map((t) => {
                const sideClass = t.side === "BUY" ? "side-buy" : "side-sell";
                const sideLabel = t.side === "BUY" ? "买入" : "卖出";
                return `<tr>
                    <td>${t.date}</td>
                    <td class="${sideClass}">${sideLabel}</td>
                    <td>${t.quantity}</td>
                    <td>${t.price.toFixed(2)}</td>
                    <td><span class="badge">${t.status}</span></td>
                </tr>`;
            }).join("");
        },

        /* ── 占位渲染（初始化时调用） ── */
        renderPlaceholder() {
            const p = this.placeholder;
            this.renderMetrics(p.metrics);
            this.renderEquityChart(p.dates, p.equity, p.idealEquity);
            this.renderDrawdownChart(p.dates, p.equity);
            this.renderTradesTable(p.trades);
        },

        /* ── API 接入预留 ── */
        async submitBacktest(params) {
            const resp = await fetch("/run", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(params),
            });
            if (!resp.ok) throw new Error("提交回测失败: " + resp.status);
            const data = await resp.json();
            return data.job_id;
        },

        async pollStatus(jobId) {
            const resp = await fetch(`/status/${jobId}`);
            if (!resp.ok) throw new Error("查询状态失败");
            return resp.json();
        },

        async fetchResults(jobId) {
            const resp = await fetch(`/results/${jobId}`);
            if (!resp.ok) throw new Error("获取结果失败");
            return resp.json();
        },

        async fetchGap(jobId) {
            const resp = await fetch(`/gap/${jobId}`);
            if (!resp.ok) throw new Error("获取差距指标失败");
            return resp.json();
        },

        renderFromApi(results, gap) {
            const dates = results.equity_curve.map((p) => p.datetime);
            const equity = results.equity_curve.map((p) => p.equity);
            const idealEquity = results.ideal_equity_curve
                ? results.ideal_equity_curve.map((p) => p.equity)
                : null;

            this.renderMetrics({
                totalReturn: results.metrics.total_return,
                maxDrawdown: results.metrics.max_drawdown,
                gap: gap ? gap.total_return_diff : null,
            });
            this.renderEquityChart(dates, equity, idealEquity);
            this.renderDrawdownChart(dates, equity);

            const trades = results.fills.map((f) => ({
                date: f.timestamp.split("+")[0],
                side: f.side,
                quantity: f.quantity,
                price: f.price,
                status: "已成交",
            }));
            this.renderTradesTable(trades);
        },

        async onRunClick() {
            const params = this.getFormData();
            this.els.btnRun.disabled = true;
            this.setStatus("正在提交…", true);

            try {
                // TODO: 取消下行注释以接入真实 API
                // const jobId = await this.submitBacktest(params);
                // this.state.jobId = jobId;
                // await this.pollUntilComplete(jobId);
                // const results = await this.fetchResults(jobId);
                // let gap = null;
                // if (params.mode === "dual") gap = await this.fetchGap(jobId);
                // this.renderFromApi(results, gap);

                // 当前：使用占位数据模拟运行
                await new Promise((r) => setTimeout(r, 600));
                this.updateModeVisibility();
                this.renderPlaceholder();
                this.setStatus("完成（占位数据）");
            } catch (err) {
                console.error(err);
                this.setStatus("失败: " + err.message);
            } finally {
                this.els.btnRun.disabled = false;
            }
        },

        async pollUntilComplete(jobId) {
            return new Promise((resolve, reject) => {
                const tick = async () => {
                    try {
                        const s = await this.pollStatus(jobId);
                        this.setStatus(`运行中 ${s.progress}%`, true);
                        if (s.status === "completed") {
                            clearInterval(this.state.pollTimer);
                            resolve();
                        } else if (s.status === "failed") {
                            clearInterval(this.state.pollTimer);
                            reject(new Error("回测失败"));
                        }
                    } catch (e) {
                        clearInterval(this.state.pollTimer);
                        reject(e);
                    }
                };
                this.state.pollTimer = setInterval(tick, 500);
                tick();
            });
        },
    };

    document.addEventListener("DOMContentLoaded", () => DashboardApp.init());
    </script>
</body>
</html>
