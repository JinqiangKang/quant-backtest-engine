<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化回测仪表盘</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a192f;
            --bg-alt: #112240;
            --text-primary: #e6f1ff;
            --text-muted: #8892b0;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --accent: #3182ce;
            --accent-hover: #2b6cb0;
            --positive: #38a169;
            --negative: #e53e3e;
            --sidebar-width: 300px;
            --header-height: 72px;
            --radius: 10px;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, var(--bg-deep) 0%, #1a365d 100%);
            color: var(--text-primary);
            font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        .header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(10, 25, 47, 0.6);
            backdrop-filter: blur(6px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #ffffff;
        }

        .layout {
            display: flex;
            gap: 24px;
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px;
            min-height: calc(100vh - var(--header-height));
        }

        .sidebar {
            flex: 0 0 var(--sidebar-width);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            color: #2d3748;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #2d3748;
            background: #f7fafc;
            transition: border-color 0.15s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(49, 130, 206, 0.2);
        }

        .form-group input:disabled,
        .form-group select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-run {
            width: 100%;
            margin-top: 8px;
            padding: 10px 16px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .btn-run:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn-run:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .btn-run.loading::after {
            content: "";
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-left: 8px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-bar {
            margin-top: 14px;
            padding: 8px 10px;
            border-radius: 6px;
            background: #edf2f7;
            font-size: 0.8rem;
            color: #4a5568;
            text-align: center;
        }

        .status-bar.running {
            background: #ebf8ff;
            color: #2b6cb0;
        }

        .status-bar.error {
            background: #fff5f5;
            color: #c53030;
        }

        .progress-wrap {
            margin-top: 10px;
            display: none;
        }

        .progress-wrap.visible {
            display: block;
        }

        .progress-track {
            height: 6px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .progress-label {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 4px;
            text-align: right;
        }

        .error-banner {
            display: none;
            padding: 12px 16px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: var(--radius);
            color: #c53030;
            font-size: 0.875rem;
        }

        .error-banner.visible {
            display: block;
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .metrics-row.dual-mode {
            grid-template-columns: repeat(4, 1fr);
        }

        .metric-card {
            text-align: center;
            padding: 18px 16px;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #718096;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a202c;
        }

        .metric-value.positive { color: var(--positive); }
        .metric-value.negative { color: var(--negative); }

        .gap-card {
            display: none;
        }

        .gap-card.visible {
            display: block;
        }

        .chart-card {
            padding: 16px 12px 8px;
        }

        .chart-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1a202c;
            padding: 0 8px 8px;
        }

        .chart-container {
            width: 100%;
            height: 320px;
        }

        .chart-container.drawdown {
            height: 240px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        thead th {
            background: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid var(--card-border);
            white-space: nowrap;
        }

        tbody td {
            padding: 9px 12px;
            border-bottom: 1px solid #edf2f7;
            color: #2d3748;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        .side-buy { color: var(--positive); font-weight: 600; }
        .side-sell { color: var(--negative); font-weight: 600; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: #c6f6d5;
            color: #276749;
        }

        .empty-row td {
            text-align: center;
            color: #a0aec0;
            padding: 24px;
        }

        @media (max-width: 1023px) {
            .layout {
                flex-direction: column;
                padding: 16px;
            }

            .sidebar {
                flex: none;
                width: 100%;
            }

            .metrics-row,
            .metrics-row.dual-mode {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>量化回测仪表盘</h1>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="card">
                <div class="card-title">回测参数</div>
                <form id="backtest-form">
                    <div class="form-group">
                        <label for="symbol">股票代码</label>
                        <input type="text" id="symbol" name="symbol" value="TEST" placeholder="例如 TEST">
                    </div>
                    <div class="form-group">
                        <label for="start-date">开始日期</label>
                        <input type="date" id="start-date" name="start_date" value="2023-01-01">
                    </div>
                    <div class="form-group">
                        <label for="end-date">结束日期</label>
                        <input type="date" id="end-date" name="end_date" value="2023-01-15">
                    </div>
                    <div class="form-group">
                        <label for="csv-path">数据文件路径</label>
                        <input type="text" id="csv-path" name="csv_path" value="tests/sample_data.csv">
                    </div>
                    <div class="form-group">
                        <label for="mode">运行模式</label>
                        <select id="mode" name="mode">
                            <option value="ideal">ideal（理想撮合）</option>
                            <option value="realistic" selected>realistic（真实撮合）</option>
                            <option value="dual">dual（双模对比）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="strategy">交易策略</label>
                        <select id="strategy" name="strategy">
                            <option value="empty">empty（无交易）</option>
                            <option value="ma_cross" selected>ma_cross（双均线）</option>
                            <option value="mean_reversion">mean_reversion（均值回归）</option>
                            <option value="periodic">periodic（周期买卖）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="latency-model">延迟模型</label>
                        <select id="latency-model" name="latency_model">
                            <option value="fixed" selected>fixed（固定延迟）</option>
                            <option value="gaussian">gaussian（高斯延迟）</option>
                            <option value="exponential">exponential（指数延迟，Python 自定义）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="latency">延迟参数 (ms / scale)</label>
                        <input type="number" id="latency" name="latency_ms" value="10" min="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="slippage">滑点 (bps)</label>
                        <input type="number" id="slippage" name="slippage_bps" value="50" min="0" step="1">
                    </div>
                    <button type="submit" class="btn-run" id="btn-run">运行回测</button>
                </form>
                <div class="status-bar" id="status-bar">就绪</div>
                <div class="progress-wrap" id="progress-wrap">
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-label" id="progress-label">0%</div>
                </div>
            </div>
        </aside>

        <main class="main">
            <div class="error-banner" id="error-banner"></div>

            <div class="metrics-row" id="metrics-row">
                <div class="card metric-card">
                    <div class="metric-label">总回报</div>
                    <div class="metric-value" id="metric-total-return">—</div>
                </div>
                <div class="card metric-card">
                    <div class="metric-label">最大回撤</div>
                    <div class="metric-value negative" id="metric-max-drawdown">—</div>
                </div>
                <div class="card metric-card gap-card" id="gap-card">
                    <div class="metric-label">回报差距 (ideal − realistic)</div>
                    <div class="metric-value" id="metric-gap">—</div>
                </div>
            </div>

            <div class="card chart-card">
                <div class="chart-title">权益曲线</div>
                <div class="chart-container" id="equity-chart"></div>
            </div>

            <div class="card chart-card">
                <div class="chart-title">回撤曲线</div>
                <div class="chart-container drawdown" id="drawdown-chart"></div>
            </div>

            <div class="card">
                <div class="card-title">交易记录</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>方向</th>
                                <th>数量</th>
                                <th>成交价</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="trades-body">
                            <tr class="empty-row"><td colspan="5">暂无交易记录，点击「运行回测」开始</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
    const DashboardApp = {
        state: {
            jobId: null,
            pollTimer: null,
            isRunning: false,
            isDual: false,
            chartsReady: { equity: false, drawdown: false },
        },

        els: {},

        plotlyConfig: {
            responsive: true,
            displayModeBar: false,
        },

        plotlyLayout: {
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(0,0,0,0)",
            margin: { t: 10, r: 20, b: 40, l: 60 },
            font: { family: "Segoe UI, system-ui, sans-serif", color: "#4a5568", size: 12 },
            xaxis: { gridcolor: "#edf2f7", linecolor: "#e2e8f0" },
            yaxis: { gridcolor: "#edf2f7", linecolor: "#e2e8f0" },
            legend: { orientation: "h", y: 1.12, x: 0 },
        },

        init() {
            this.cacheElements();
            this.bindEvents();
            this.updateModeVisibility();
            this.initEmptyCharts();
        },

        cacheElements() {
            this.els = {
                form:          document.getElementById("backtest-form"),
                mode:          document.getElementById("mode"),
                btnRun:        document.getElementById("btn-run"),
                statusBar:     document.getElementById("status-bar"),
                progressWrap:  document.getElementById("progress-wrap"),
                progressFill:  document.getElementById("progress-fill"),
                progressLabel: document.getElementById("progress-label"),
                errorBanner:   document.getElementById("error-banner"),
                metricsRow:    document.getElementById("metrics-row"),
                gapCard:       document.getElementById("gap-card"),
                totalReturn:   document.getElementById("metric-total-return"),
                maxDrawdown:   document.getElementById("metric-max-drawdown"),
                gap:           document.getElementById("metric-gap"),
                equityChart:   document.getElementById("equity-chart"),
                drawdownChart: document.getElementById("drawdown-chart"),
                tradesBody:    document.getElementById("trades-body"),
            };
        },

        bindEvents() {
            this.els.form.addEventListener("submit", (e) => {
                e.preventDefault();
                if (!this.state.isRunning) {
                    this.onRunClick();
                }
            });
            this.els.mode.addEventListener("change", () => {
                this.updateModeVisibility();
            });
        },

        updateModeVisibility() {
            const isDual = this.els.mode.value === "dual";
            this.state.isDual = isDual;
            this.els.gapCard.classList.toggle("visible", isDual);
            this.els.metricsRow.classList.toggle("dual-mode", isDual);
        },

        /* ── 工具函数 ── */
        formatPercent(value, digits = 2) {
            const sign = value >= 0 ? "+" : "";
            return sign + (value * 100).toFixed(digits) + "%";
        },

        computeDrawdown(equity) {
            if (!equity.length) return [];
            let peak = equity[0];
            return equity.map((v) => {
                peak = Math.max(peak, v);
                return peak > 0 ? -(peak - v) / peak : 0;
            });
        },

        getFormData() {
            const fd = new FormData(this.els.form);
            return {
                symbol:       fd.get("symbol"),
                start_date:   fd.get("start_date"),
                end_date:     fd.get("end_date"),
                csv_path:     fd.get("csv_path"),
                mode:         fd.get("mode"),
                strategy:     fd.get("strategy"),
                strategy_params: {},
                latency_model: fd.get("latency_model"),
                latency_ms:   parseFloat(fd.get("latency_ms")) || 0,
                slippage_bps: parseFloat(fd.get("slippage_bps")) || 0,
            };
        },

        setRunning(running) {
            this.state.isRunning = running;
            this.els.btnRun.disabled = running;
            this.els.btnRun.classList.toggle("loading", running);
            this.els.btnRun.textContent = running ? "运行中…" : "运行回测";
            this.els.form.querySelectorAll("input, select").forEach((el) => {
                el.disabled = running;
            });
        },

        setStatus(text, type = "idle") {
            this.els.statusBar.textContent = text;
            this.els.statusBar.className = "status-bar";
            if (type === "running") this.els.statusBar.classList.add("running");
            if (type === "error")   this.els.statusBar.classList.add("error");
        },

        setProgress(percent) {
            const p = Math.max(0, Math.min(100, percent));
            this.els.progressWrap.classList.add("visible");
            this.els.progressFill.style.width = p + "%";
            this.els.progressLabel.textContent = p + "%";
        },

        hideProgress() {
            this.els.progressWrap.classList.remove("visible");
            this.els.progressFill.style.width = "0%";
            this.els.progressLabel.textContent = "0%";
        },

        showError(message) {
            this.els.errorBanner.textContent = message;
            this.els.errorBanner.classList.add("visible");
            this.setStatus("失败", "error");
        },

        clearError() {
            this.els.errorBanner.textContent = "";
            this.els.errorBanner.classList.remove("visible");
        },

        stopPolling() {
            if (this.state.pollTimer) {
                clearInterval(this.state.pollTimer);
                this.state.pollTimer = null;
            }
        },

        /* ── Plotly 封装：首次 newPlot，后续 react ── */
        plotChart(key, container, traces, layout) {
            if (this.state.chartsReady[key]) {
                Plotly.react(container, traces, layout, this.plotlyConfig);
            } else {
                Plotly.newPlot(container, traces, layout, this.plotlyConfig);
                this.state.chartsReady[key] = true;
            }
        },

        initEmptyCharts() {
            const emptyTrace = {
                x: [], y: [], type: "scatter", mode: "lines", line: { color: "#cbd5e0" },
            };
            const layout = Object.assign({}, this.plotlyLayout, {
                yaxis: Object.assign({}, this.plotlyLayout.yaxis, { title: "净值" }),
            });
            this.plotChart("equity", this.els.equityChart, [emptyTrace], layout);

            const ddLayout = Object.assign({}, this.plotlyLayout, {
                yaxis: Object.assign({}, this.plotlyLayout.yaxis, {
                    tickformat: ".1%", title: "回撤",
                }),
            });
            this.plotChart("drawdown", this.els.drawdownChart, [emptyTrace], ddLayout);
        },

        /* ── 渲染函数 ── */
        renderMetrics(metrics) {
            const tr = metrics.totalReturn ?? 0;
            this.els.totalReturn.textContent = this.formatPercent(tr);
            this.els.totalReturn.className = "metric-value " + (tr >= 0 ? "positive" : "negative");

            const dd = metrics.maxDrawdown ?? 0;
            this.els.maxDrawdown.textContent = "-" + (dd * 100).toFixed(2) + "%";

            if (this.state.isDual && metrics.gap != null) {
                this.els.gap.textContent = this.formatPercent(metrics.gap);
                this.els.gap.className = "metric-value " + (metrics.gap >= 0 ? "positive" : "negative");
            } else if (!this.state.isDual) {
                this.els.gap.textContent = "—";
            }
        },

        renderEquityChart(dates, equity, idealEquity) {
            const traces = [{
                x: dates,
                y: equity,
                type: "scatter",
                mode: "lines",
                name: this.state.isDual ? "realistic" : "权益",
                line: { color: "#3182ce", width: 2 },
            }];

            if (this.state.isDual && idealEquity && idealEquity.length) {
                const idealDates = dates;
                traces.push({
                    x: idealDates,
                    y: idealEquity,
                    type: "scatter",
                    mode: "lines",
                    name: "ideal",
                    line: { color: "#38a169", width: 2, dash: "dot" },
                });
            }

            const layout = Object.assign({}, this.plotlyLayout, {
                yaxis: Object.assign({}, this.plotlyLayout.yaxis, {
                    tickformat: ",.0f",
                    title: "净值",
                }),
            });

            this.plotChart("equity", this.els.equityChart, traces, layout);
        },

        renderDrawdownChart(dates, equity) {
            const dd = this.computeDrawdown(equity);
            const trace = {
                x: dates,
                y: dd,
                type: "scatter",
                mode: "lines",
                fill: "tozeroy",
                name: "回撤",
                line: { color: "#e53e3e", width: 1.5 },
                fillcolor: "rgba(229, 62, 62, 0.12)",
            };

            const layout = Object.assign({}, this.plotlyLayout, {
                yaxis: Object.assign({}, this.plotlyLayout.yaxis, {
                    tickformat: ".1%",
                    title: "回撤",
                }),
            });

            this.plotChart("drawdown", this.els.drawdownChart, [trace], layout);
        },

        renderTradesTable(trades) {
            if (!trades.length) {
                this.els.tradesBody.innerHTML =
                    '<tr class="empty-row"><td colspan="5">暂无交易记录</td></tr>';
                return;
            }

            this.els.tradesBody.innerHTML = trades.map((t) => {
                const sideClass = t.side === "BUY" ? "side-buy" : "side-sell";
                const sideLabel = t.side === "BUY" ? "买入" : "卖出";
                return `<tr>
                    <td>${t.date}</td>
                    <td class="${sideClass}">${sideLabel}</td>
                    <td>${t.quantity}</td>
                    <td>${Number(t.price).toFixed(2)}</td>
                    <td><span class="badge">${t.status}</span></td>
                </tr>`;
            }).join("");
        },

        renderFromApi(results, gap) {
            const dates  = results.equity_curve.map((p) => p.datetime);
            const equity = results.equity_curve.map((p) => p.equity);
            const idealEquity = results.ideal_equity_curve
                ? results.ideal_equity_curve.map((p) => p.equity)
                : null;

            this.renderMetrics({
                totalReturn: results.metrics.total_return,
                maxDrawdown: results.metrics.max_drawdown,
                gap: gap && gap.total_return_diff != null ? gap.total_return_diff : null,
            });
            this.renderEquityChart(dates, equity, idealEquity);
            this.renderDrawdownChart(dates, equity);

            const trades = results.fills.map((f) => ({
                date:     (f.timestamp || "").split("+")[0],
                side:     f.side,
                quantity: f.quantity,
                price:    f.price,
                status:   "已成交",
            }));
            this.renderTradesTable(trades);
        },

        /* ── API 调用 ── */
        async apiPost(path, body) {
            const resp = await fetch(path, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            if (!resp.ok) {
                const detail = await resp.text().catch(() => "");
                throw new Error(`请求失败 (${resp.status})${detail ? ": " + detail : ""}`);
            }
            return resp.json();
        },

        async apiGet(path) {
            const resp = await fetch(path);
            if (!resp.ok) {
                const detail = await resp.text().catch(() => "");
                throw new Error(`请求失败 (${resp.status})${detail ? ": " + detail : ""}`);
            }
            return resp.json();
        },

        async submitBacktest(params) {
            const data = await this.apiPost("/run", params);
            if (!data.job_id) throw new Error("服务器未返回 job_id");
            return data.job_id;
        },

        pollUntilComplete(jobId) {
            return new Promise((resolve, reject) => {
                this.stopPolling();

                const tick = async () => {
                    try {
                        const s = await this.apiGet(`/status/${jobId}`);
                        this.setProgress(s.progress || 0);
                        this.setStatus(`运行中 ${s.progress || 0}%`, "running");

                        if (s.status === "completed") {
                            this.stopPolling();
                            resolve();
                        } else if (s.status === "failed") {
                            this.stopPolling();
                            reject(new Error("回测任务失败，请检查参数或后端日志"));
                        }
                    } catch (err) {
                        this.stopPolling();
                        reject(err);
                    }
                };

                this.state.pollTimer = setInterval(tick, 500);
                tick();
            });
        },

        async fetchResults(jobId) {
            return this.apiGet(`/results/${jobId}`);
        },

        async fetchGap(jobId) {
            const data = await this.apiGet(`/gap/${jobId}`);
            if (data.error) return null;
            return data;
        },

        /* ── 运行回测主流程 ── */
        async onRunClick() {
            const params = this.getFormData();
            this.clearError();
            this.updateModeVisibility();
            this.setRunning(true);
            this.setStatus("正在提交…", "running");
            this.setProgress(0);

            try {
                const jobId = await this.submitBacktest(params);
                this.state.jobId = jobId;
                this.setStatus("回测已提交，等待完成…", "running");

                await this.pollUntilComplete(jobId);

                this.setProgress(100);
                this.setStatus("正在加载结果…", "running");

                const results = await this.fetchResults(jobId);
                let gap = null;
                if (params.mode === "dual") {
                    gap = await this.fetchGap(jobId);
                }

                this.renderFromApi(results, gap);
                this.setStatus("回测完成");
                this.hideProgress();
            } catch (err) {
                console.error(err);
                this.showError(err.message || "未知错误");
                this.hideProgress();
            } finally {
                this.stopPolling();
                this.setRunning(false);
            }
        },
    };

    document.addEventListener("DOMContentLoaded", () => DashboardApp.init());
    </script>
</body>
